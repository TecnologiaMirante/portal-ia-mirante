name: Atualizar Notícias de IA

on:
  schedule:
    - cron: '0 10 * * *'   # 07:00 BRT (UTC-3) todos os dias
  workflow_dispatch:        # permite rodar manualmente no GitHub

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependências
        run: npm ci

      - name: Buscar notícias
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/fetch-news.mjs

      - name: Commitar se houver mudanças
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/news.json
          git diff --staged --quiet && echo "Sem novidades." || (
            git commit -m "chore: atualizar notícias de IA $(date +'%d/%m/%Y') [skip ci]"
            git push
          )
